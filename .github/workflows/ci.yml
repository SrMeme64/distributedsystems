name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            application/package-lock.json
            web/package-lock.json

      - name: Install API dependencies
        run: npm ci --prefix application

      - name: Run API unit tests
        run: npm test --prefix application

      - name: Audit production dependencies
        run: npm audit --prefix application --omit=dev

      - name: Audit web dependencies
        run: npm audit --prefix web

      - name: Build API image
        run: docker build --tag store-catalog-api:ci --file application/Dockerfile application

      - name: Build web image
        run: docker build --tag store-web:ci --file web/Dockerfile web

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.37.2

      - name: Validate Kubernetes manifests
        run: |
          ./deploy/overlays/local/create-secrets.sh
          kubectl kustomize deploy/base > /dev/null
          kubectl kustomize deploy/overlays/local > /dev/null
          kubectl kustomize clusters/dev/flux-system/kube-vip > /dev/null
          python3 -c 'from pathlib import Path; assert Path("database/catalog.sql").read_bytes().rstrip(b"\n") == Path("deploy/base/catalog.sql").read_bytes().rstrip(b"\n")'

      - name: Check shell scripts and patch formatting
        run: |
          bash -n deploy/overlays/local/create-secrets.sh
          bash -n deploy/scripts/backup-local.sh
          bash -n deploy/scripts/verify-backup-local.sh
          bash -n deploy/scripts/build-images.sh
          bash -n deploy/scripts/smoke.sh
          bash -n deploy/observability/start-local.sh
          python3 -B -c 'import ast; from pathlib import Path; ast.parse(Path("deploy/scripts/benchmark.py").read_text())'
          python3 -m json.tool deploy/observability/grafana/api-overview.json > /dev/null
          git diff --check

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate Terraform configurations
        run: |
          for root in infra/terraform/envs/dev infra/terraform/envs/dev-flux; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Lint Terraform configurations
        run: |
          for root in infra/terraform/envs/dev infra/terraform/envs/dev-flux; do
            tflint --chdir="$root"
          done

      - name: Scan Terraform configurations
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
