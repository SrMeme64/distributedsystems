# Sentinel configuration. It is copied to a writable path inside each
# container because Sentinel rewrites this file as the topology changes.
#
# The master is addressed by its fixed Docker IP instead of its hostname.
# Docker removes a stopped container from its DNS, and Sentinel enters TILT
# when it cannot resolve the monitored hostname, which blocks failover. The
# fixed IP keeps the monitor address resolvable for the whole experiment.
port 26379
dir /data

sentinel monitor mymaster 172.32.0.11 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1
