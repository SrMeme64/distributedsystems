# Disposable cache replica: no AOF and no RDB snapshots.
save ""
appendonly no

# Fixed IP of redis-master on the database network. Sentinel rewrites this at
# runtime after a failover, but the fixed address survives a container restart.
replicaof 172.32.0.11 6379
replica-read-only yes

maxmemory 128mb
maxmemory-policy allkeys-lru
