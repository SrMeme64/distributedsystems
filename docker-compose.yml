name: distributed-three-tier

services:
  presentation-lb-master:
    image: haproxy:3.2-alpine
    volumes:
      - ./haproxy/presentation-master.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: always
    depends_on:
      web1:
        condition: service_started
      web2:
        condition: service_started
      web3:
        condition: service_started
    networks:
      edge:
        ipv4_address: 172.30.0.11

  presentation-lb-backup:
    image: haproxy:3.2-alpine
    volumes:
      - ./haproxy/presentation-backup.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: always
    depends_on:
      web1:
        condition: service_started
      web2:
        condition: service_started
      web3:
        condition: service_started
    networks:
      edge:
        ipv4_address: 172.30.0.12

  presentation-entry:
    image: haproxy:3.2-alpine
    ports:
      - "80:80"
    volumes:
      - ./haproxy/presentation-entry.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: always
    depends_on:
      - presentation-lb-master
      - presentation-lb-backup
    networks:
      - edge

  presentation-keepalived-master:
    build:
      context: ./keepalived
      args:
        KEEPALIVED_CONFIG: presentation-master.conf
    network_mode: "service:presentation-lb-master"
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    restart: always
    depends_on:
      presentation-lb-master:
        condition: service_started

  presentation-keepalived-backup:
    build:
      context: ./keepalived
      args:
        KEEPALIVED_CONFIG: presentation-backup.conf
    network_mode: "service:presentation-lb-backup"
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    restart: always
    depends_on:
      presentation-lb-backup:
        condition: service_started

  web1:
    image: nginx:alpine
    hostname: webnode1
    restart: always
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/site1:/usr/share/nginx/html:ro
      - ./web/catalog.js:/usr/share/nginx/catalog.js:ro
      - ./web/catalog.css:/usr/share/nginx/catalog.css:ro
    depends_on:
      - application-lb-master
    networks:
      - edge
      - application

  web2:
    image: nginx:alpine
    hostname: webnode2
    restart: always
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/site2:/usr/share/nginx/html:ro
      - ./web/catalog.js:/usr/share/nginx/catalog.js:ro
      - ./web/catalog.css:/usr/share/nginx/catalog.css:ro
    depends_on:
      - application-lb-master
    networks:
      - edge
      - application

  web3:
    image: nginx:alpine
    hostname: webnode3
    restart: always
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/site3:/usr/share/nginx/html:ro
      - ./web/catalog.js:/usr/share/nginx/catalog.js:ro
      - ./web/catalog.css:/usr/share/nginx/catalog.css:ro
    depends_on:
      - application-lb-master
    networks:
      - edge
      - application

  application-lb-master:
    image: haproxy:3.2-alpine
    volumes:
      - ./haproxy/application-master.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: always
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started
    networks:
      application:
        ipv4_address: 172.31.0.11

  application-lb-backup:
    image: haproxy:3.2-alpine
    volumes:
      - ./haproxy/application-backup.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: always
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started
    networks:
      application:
        ipv4_address: 172.31.0.12

  application-keepalived-master:
    build:
      context: ./keepalived
      args:
        KEEPALIVED_CONFIG: application-master.conf
    network_mode: "service:application-lb-master"
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    restart: always
    depends_on:
      application-lb-master:
        condition: service_started

  application-keepalived-backup:
    build:
      context: ./keepalived
      args:
        KEEPALIVED_CONFIG: application-backup.conf
    network_mode: "service:application-lb-backup"
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    restart: always
    depends_on:
      application-lb-backup:
        condition: service_started

  app1:
    build: ./application
    environment: &application-environment
      DB_HOST: proxysql
      DB_PORT: 6033
      DB_NAME: ${CATALOG_DB_NAME:?Set CATALOG_DB_NAME in the Compose env file}
      DB_USER: ${CATALOG_DB_USER:?Set CATALOG_DB_USER in the Compose env file}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in the Compose env file}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      MONGO_HOSTS: mongo1,mongo2,mongo3
      MONGO_PORT: 27017
      MONGO_REPLICA_SET: rs0
      MONGO_DB: ${MONGO_DB_NAME:?Set MONGO_DB_NAME in the Compose env file}
      MONGO_USER: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in the Compose env file}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in the Compose env file}
      CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS:-60}
      REDIS_SENTINELS: redis-sentinel1:26379,redis-sentinel2:26379,redis-sentinel3:26379
      REDIS_MASTER_NAME: mymaster
      APPLICATION_NODE: app1
    restart: always
    stop_grace_period: 20s
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    networks:
      application:
        ipv4_address: 172.31.0.21
      database: {}

  app2:
    build: ./application
    environment:
      <<: *application-environment
      APPLICATION_NODE: app2
    restart: always
    stop_grace_period: 20s
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    networks:
      application:
        ipv4_address: 172.31.0.22
      database: {}

  app3:
    build: ./application
    environment:
      <<: *application-environment
      APPLICATION_NODE: app3
    restart: always
    stop_grace_period: 20s
    depends_on:
      catalog-init:
        condition: service_completed_successfully
    networks:
      application:
        ipv4_address: 172.31.0.23
      database: {}

  db-bootstrap:
    build: ./application
    command: ["node", "init-db-users.js"]
    environment:
      DB_BOOTSTRAP_HOSTS: galera1,galera2,galera3
      DB_PORT: 3306
      DB_ADMIN_USER: root
      DB_ADMIN_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in the Compose env file}
      PROXYSQL_MONITOR_USER: ${PROXYSQL_MONITOR_USER:-proxysql_monitor}
      PROXYSQL_MONITOR_PASSWORD: ${PROXYSQL_MONITOR_PASSWORD:?Set PROXYSQL_MONITOR_PASSWORD in the Compose env file}
    restart: "no"
    depends_on:
      galera1:
        condition: service_healthy
    networks:
      - database

  proxysql:
    build: ./proxysql
    environment:
      PROXYSQL_ADMIN_PASSWORD: ${PROXYSQL_ADMIN_PASSWORD:?Set PROXYSQL_ADMIN_PASSWORD in the Compose env file}
      PROXYSQL_MONITOR_USER: ${PROXYSQL_MONITOR_USER:-proxysql_monitor}
      PROXYSQL_MONITOR_PASSWORD: ${PROXYSQL_MONITOR_PASSWORD:?Set PROXYSQL_MONITOR_PASSWORD in the Compose env file}
      CATALOG_DB_NAME: ${CATALOG_DB_NAME:?Set CATALOG_DB_NAME in the Compose env file}
      CATALOG_DB_USER: ${CATALOG_DB_USER:?Set CATALOG_DB_USER in the Compose env file}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in the Compose env file}
    restart: always
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - mysql -u admin -p"$${PROXYSQL_ADMIN_PASSWORD}" -h 127.0.0.1 -P6032 -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - database

  catalog-init:
    build: ./application
    command: ["node", "init-db.js"]
    environment:
      <<: *application-environment
      MONGO_ADMIN_USER: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in the Compose env file}
      MONGO_ADMIN_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the Compose env file}
    volumes:
      - ./database/catalog.sql:/app/database/catalog.sql:ro
    restart: "no"
    depends_on:
      galera1:
        condition: service_healthy
      proxysql:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    networks:
      - database

  mongo-keyfile-init:
    image: mongo:8
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -s /keyfile/keyfile ]; then
          head -c 512 /dev/urandom | base64 > /keyfile/keyfile
        fi
        chown 999:999 /keyfile/keyfile
        chmod 400 /keyfile/keyfile
    volumes:
      - mongo-keyfile:/keyfile
    restart: "no"
    networks:
      - database

  mongo1:
    image: mongo:8
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /keyfile/keyfile
      - --wiredTigerCacheSizeGB
      - "0.25"
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in the Compose env file}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the Compose env file}
    volumes:
      - mongodb-data:/data/db
      - mongo-keyfile:/keyfile:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_ROOT_USERNAME"
          --password "$$MONGO_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always
    stop_grace_period: 45s
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
    networks:
      - database

  mongo2:
    image: mongo:8
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /keyfile/keyfile
      - --wiredTigerCacheSizeGB
      - "0.25"
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in the Compose env file}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the Compose env file}
    volumes:
      - mongodb2-data:/data/db
      - mongo-keyfile:/keyfile:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_ROOT_USERNAME"
          --password "$$MONGO_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always
    stop_grace_period: 45s
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
      mongo1:
        condition: service_started
    networks:
      - database

  mongo3:
    image: mongo:8
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /keyfile/keyfile
      - --wiredTigerCacheSizeGB
      - "0.25"
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in the Compose env file}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the Compose env file}
    volumes:
      - mongodb3-data:/data/db
      - mongo-keyfile:/keyfile:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_ROOT_USERNAME"
          --password "$$MONGO_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always
    stop_grace_period: 45s
    depends_on:
      mongo-keyfile-init:
        condition: service_completed_successfully
      mongo1:
        condition: service_started
    networks:
      - database

  mongo-init:
    image: mongo:8
    network_mode: "service:mongo1"
    entrypoint: ["/bin/bash", "/scripts/init-replica.sh"]
    environment:
      MONGO_BOOTSTRAP_HOST: 127.0.0.1:27017
      MONGO_REPLICA_SET: rs0
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in the Compose env file}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the Compose env file}
    volumes:
      - ./mongo/init-replica.sh:/scripts/init-replica.sh:ro
    restart: "no"
    depends_on:
      mongo1:
        condition: service_started
      mongo2:
        condition: service_started
      mongo3:
        condition: service_started

  redis-master:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis-master.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    networks:
      database:
        ipv4_address: 172.32.0.11

  redis-replica1:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis-replica.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      database:
        ipv4_address: 172.32.0.12

  redis-replica2:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis-replica.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      database:
        ipv4_address: 172.32.0.13

  redis-sentinel1:
    image: redis:7-alpine
    command:
      - /bin/sh
      - -c
      - |
        cp /usr/local/etc/redis/sentinel.conf /data/sentinel.conf
        exec redis-server /data/sentinel.conf --sentinel
    volumes:
      - ./redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica1:
        condition: service_started
      redis-replica2:
        condition: service_started
    networks:
      database:
        ipv4_address: 172.32.0.14

  redis-sentinel2:
    image: redis:7-alpine
    command:
      - /bin/sh
      - -c
      - |
        cp /usr/local/etc/redis/sentinel.conf /data/sentinel.conf
        exec redis-server /data/sentinel.conf --sentinel
    volumes:
      - ./redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica1:
        condition: service_started
      redis-replica2:
        condition: service_started
    networks:
      database:
        ipv4_address: 172.32.0.15

  redis-sentinel3:
    image: redis:7-alpine
    command:
      - /bin/sh
      - -c
      - |
        cp /usr/local/etc/redis/sentinel.conf /data/sentinel.conf
        exec redis-server /data/sentinel.conf --sentinel
    volumes:
      - ./redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica1:
        condition: service_started
      redis-replica2:
        condition: service_started
    networks:
      database:
        ipv4_address: 172.32.0.16

  galera1:
    image: bitnamilegacy/mariadb-galera:11.4.7-debian-12-r3
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in the Compose env file}
      MARIADB_DATABASE: ${CATALOG_DB_NAME:?Set CATALOG_DB_NAME in the Compose env file}
      MARIADB_USER: ${CATALOG_DB_USER:?Set CATALOG_DB_USER in the Compose env file}
      MARIADB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD in the Compose env file}
      MARIADB_GALERA_CLUSTER_NAME: distributed-cluster
      MARIADB_GALERA_CLUSTER_ADDRESS: gcomm://galera1,galera2,galera3
      MARIADB_GALERA_CLUSTER_BOOTSTRAP: "yes"
      MARIADB_GALERA_MARIABACKUP_USER: mariabackup
      MARIADB_GALERA_MARIABACKUP_PASSWORD: ${MARIADB_BACKUP_PASSWORD:?Set MARIADB_BACKUP_PASSWORD in the Compose env file}
      GALERA_PEERS: "galera2 galera3"
      GALERA_BOOTSTRAP_FALLBACK: "yes"
      GALERA_PEER_WAIT_SECONDS: "30"
    entrypoint: ["/bin/bash", "/usr/local/bin/galera-entrypoint.sh"]
    restart: always
    stop_grace_period: 60s
    volumes:
      - galera1-data:/bitnami/mariadb
      - ./galera/entrypoint.sh:/usr/local/bin/galera-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - database

  galera2:
    image: bitnamilegacy/mariadb-galera:11.4.7-debian-12-r3
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in the Compose env file}
      MARIADB_GALERA_CLUSTER_NAME: distributed-cluster
      MARIADB_GALERA_CLUSTER_ADDRESS: gcomm://galera1,galera2,galera3
      MARIADB_GALERA_CLUSTER_BOOTSTRAP: "no"
      MARIADB_GALERA_MARIABACKUP_USER: mariabackup
      MARIADB_GALERA_MARIABACKUP_PASSWORD: ${MARIADB_BACKUP_PASSWORD:?Set MARIADB_BACKUP_PASSWORD in the Compose env file}
    restart: always
    stop_grace_period: 60s
    volumes:
      - galera2-data:/bitnami/mariadb
    depends_on:
      galera1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - database

  galera3:
    image: bitnamilegacy/mariadb-galera:11.4.7-debian-12-r3
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in the Compose env file}
      MARIADB_GALERA_CLUSTER_NAME: distributed-cluster
      MARIADB_GALERA_CLUSTER_ADDRESS: gcomm://galera1,galera2,galera3
      MARIADB_GALERA_CLUSTER_BOOTSTRAP: "no"
      MARIADB_GALERA_MARIABACKUP_USER: mariabackup
      MARIADB_GALERA_MARIABACKUP_PASSWORD: ${MARIADB_BACKUP_PASSWORD:?Set MARIADB_BACKUP_PASSWORD in the Compose env file}
    restart: always
    stop_grace_period: 60s
    volumes:
      - galera3-data:/bitnami/mariadb
    depends_on:
      galera1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - database

  nagios:
    image: jasonrivers/nagios:latest
    restart: always
    # The base image ships a stale /var/run/nsca.pid (PID 21). Without removing
    # it, nsca believes another instance is running and runit restarts it in a
    # tight loop. Remove the stale file before starting the supervisors.
    entrypoint: ["/bin/bash", "-c", "rm -f /var/run/nsca.pid && exec /usr/local/bin/start_nagios"]
    ports:
      - "127.0.0.1:8088:80"
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/nagios/); [ \"$$code\" = \"200\" ] || [ \"$$code\" = \"401\" ]"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      NAGIOSADMIN_USER: nagiosadmin
      NAGIOSADMIN_PASS: ${NAGIOSADMIN_PASSWORD:?Set NAGIOSADMIN_PASSWORD in the Compose env file}
    volumes:
      - ./nagios/architecture.cfg:/opt/nagios/etc/objects/localhost.cfg:ro
    depends_on:
      - presentation-lb-master
      - presentation-lb-backup
      - presentation-keepalived-master
      - presentation-keepalived-backup
      - web1
      - web2
      - web3
      - application-lb-master
      - application-lb-backup
      - application-keepalived-master
      - application-keepalived-backup
      - app1
      - app2
      - app3
      - catalog-init
      - proxysql
      - mongo1
      - mongo2
      - mongo3
      - redis-master
      - redis-replica1
      - redis-replica2
      - redis-sentinel1
      - redis-sentinel2
      - redis-sentinel3
      - galera1
      - galera2
      - galera3
    networks:
      - edge
      - application
      - database

volumes:
  galera1-data:
  galera2-data:
  galera3-data:
  mongodb-data:
  mongodb2-data:
  mongodb3-data:
  mongo-keyfile:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Dynamic containers only get .128-.254 so they can never take a
          # static address (.11/.12) while that container is stopped.
          ip_range: 172.30.0.128/25
  application:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
          # API nodes keep fixed addresses for Nagios checks when Docker DNS
          # removes a stopped container from service discovery.
          ip_range: 172.31.0.128/25
  database:
    internal: true
    ipam:
      config:
        - subnet: 172.32.0.0/24
          # Redis keeps .11-.16 fixed; Sentinel and the replicas address
          # redis-master by 172.32.0.11, so dynamic allocation must not
          # reuse that address after a stop/start of the whole stack.
          ip_range: 172.32.0.128/25
