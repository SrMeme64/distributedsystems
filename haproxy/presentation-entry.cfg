global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend entry
    bind *:80
    default_backend presentation_vip

backend presentation_vip
    # The VIP is owned by Keepalived, which moves it between the two
    # presentation HAProxy containers. Do not health-check it here: a second
    # detection layer (fall 2 + rise 2) adds ~4 s to the failover. HTTP mode
    # plus http-server-close ensures every request opens a new connection to
    # whichever node owns the VIP, instead of reusing a frozen connection.
    option http-server-close
    server vip 172.30.0.250:80
