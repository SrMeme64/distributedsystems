apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8.0.17
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: MONGO_DB
          envFrom:
            - secretRef:
                name: mongodb-secrets
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  mongosh --quiet --host 127.0.0.1 --eval
                  'const admin = db.getSiblingDB("admin");
                  admin.auth(process.env.MONGO_INITDB_ROOT_USERNAME,
                  process.env.MONGO_INITDB_ROOT_PASSWORD).ok &&
                  db.adminCommand({ ping: 1 }).ok' | grep -q '^1$'
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  mongosh --quiet --host 127.0.0.1 --eval
                  'const admin = db.getSiblingDB("admin");
                  admin.auth(process.env.MONGO_INITDB_ROOT_USERNAME,
                  process.env.MONGO_INITDB_ROOT_PASSWORD).ok &&
                  db.adminCommand({ ping: 1 }).ok' | grep -q '^1$'
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  mongosh --quiet --host 127.0.0.1 --eval
                  'const admin = db.getSiblingDB("admin");
                  admin.auth(process.env.MONGO_INITDB_ROOT_USERNAME,
                  process.env.MONGO_INITDB_ROOT_PASSWORD).ok &&
                  db.adminCommand({ ping: 1 }).ok' | grep -q '^1$'
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: mongodb-init
              mountPath: /docker-entrypoint-initdb.d/10-create-app-user.js
              subPath: 10-create-app-user.js
              readOnly: true
      volumes:
        - name: mongodb-init
          configMap:
            name: mongodb-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
