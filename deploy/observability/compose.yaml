name: store-observability

services:
  lgtm:
    image: grafana/otel-lgtm:0.41.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?run create-secrets.sh first}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/api-overview.json
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:9090:9090"
      - "${LGTM_OTLP_BIND_ADDRESS:?start-local.sh must set the Minikube gateway}:4317:4317"
      - "${LGTM_OTLP_BIND_ADDRESS:?start-local.sh must set the Minikube gateway}:4318:4318"
    volumes:
      - lgtm-data:/data
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./grafana/api-overview.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/api-overview.json:ro
    mem_limit: 2g
    cpus: 2
    init: true
    restart: unless-stopped

volumes:
  lgtm-data:
    name: distributed-observability-data
