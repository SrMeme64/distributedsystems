apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: review-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: review-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: store-catalog-api:dev
          imagePullPolicy: IfNotPresent
          command:
            - node
            - --import
            - ./instrumentation.js
            - worker.js
          ports:
            - name: health
              containerPort: 8081
          env:
            - name: OTEL_SERVICE_NAME
              value: store-review-worker
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: WORKER_HEALTH_PORT
              value: "8081"
            - name: MONGO_HOST
              value: mongodb
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_DB
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: MONGO_DB
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: MONGO_USER
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: MONGO_PASSWORD
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secrets
                  key: RABBITMQ_URL
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
