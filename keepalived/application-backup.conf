global_defs {
    router_id APPLICATION_BACKUP
    enable_script_security
    script_user root
}

vrrp_script check_haproxy {
    script "/usr/local/bin/check-haproxy.sh 8080"
    interval 1
    timeout 2
    fall 2
    rise 2
    weight -20
}

vrrp_instance VI_APPLICATION {
    state BACKUP
    interface eth0
    virtual_router_id 52
    priority 100
    advert_int 1
    unicast_src_ip 172.31.0.12
    unicast_peer {
        172.31.0.11
    }
    authentication {
        auth_type PASS
        auth_pass DISTHA02
    }
    virtual_ipaddress {
        172.31.0.250/24 dev eth0
    }
    track_script {
        check_haproxy
    }
}